[tool.poetry]
name = "atlas"
version = "1.0.0"
description = "Atlas – Digital Banking Intelligence Platform"
authors = ["Atlas Team"]
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | data
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["backend", "analytics", "etl"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=backend --cov=analytics --cov=etl --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["backend", "analytics", "etl"]
omit = ["*/tests/*", "*/__init__.py"]
